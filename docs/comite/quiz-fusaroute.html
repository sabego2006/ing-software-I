// ───────────────────────── motor ─────────────────────────
const QUESTIONS = BANK.map((r, id) => ({
  id, cat: r[0], q: r[1], explain: r[4], src: r[5],
  options: [{ text: r[2], correct: true }, ...r[3].map(t => ({ text: t, correct: false }))]
}));

const $ = s => document.querySelector(s);
const app = $('#app');
const esc = s => s.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const fmt = s => esc(s).replace(/`([^`]+)`/g, '<code>$1</code>');
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };

let order = [], pos = 0, answers = {}, opts = {}, showingSummary = false;

function start(ids) {
  order = shuffle(ids);
  pos = 0; answers = {}; showingSummary = false;
  opts = {};
  order.forEach(id => { opts[id] = shuffle(QUESTIONS[id].options); });
  render();
}

function filteredIds() {
  const c = $('#cat').value;
  return QUESTIONS.filter(q => c === 'all' || q.cat === c).map(q => q.id);
}

function updateStats() {
  const done = Object.keys(answers).length;
  const ok = Object.values(answers).filter(a => a.correct).length;
  $('#ok').textContent = ok;
  $('#done').textContent = done;
  $('#pct').textContent = (done ? Math.round(ok * 100 / done) : 0) + ' %';
  $('#pos').textContent = showingSummary ? 'Resultados' : `Pregunta ${pos + 1} de ${order.length}`;
  $('#prog').style.width = (order.length ? done * 100 / order.length : 0) + '%';
}

function render() {
  updateStats();
  if (showingSummary) return renderSummary();
  const id = order[pos], q = QUESTIONS[id], a = answers[id];
  const list = opts[id];
  app.innerHTML = `
    <article class="card">
      <div class="meta"><span class="chip">${esc(q.cat)}</span><span>#${id + 1}</span></div>
      <p class="q">${fmt(q.q)}</p>
      <div class="opts">
        ${list.map((o, i) => {
          let cls = '';
          if (a) { if (o.correct) cls = 'ok'; else if (i === a.chosen) cls = 'bad'; else cls = 'dim'; }
          return `<button class="opt ${cls}" data-i="${i}" ${a ? 'disabled' : ''}><span class="k">${i + 1}</span><span>${fmt(o.text)}</span></button>`;
        }).join('')}
      </div>
      ${a ? `<div class="fb ${a.correct ? '' : 'bad'}">
        <h3>${a.correct ? '✓ Correcto' : '✗ Incorrecto: la respuesta correcta está en verde'}</h3>
        <p>${fmt(q.explain)}</p>
        <div class="src">Fuente: ${fmt(q.src)}</div>
      </div>` : ''}
      <div class="nav">
        <button class="btn" id="prev" ${pos === 0 ? 'disabled' : ''}>← Anterior</button>
        <button class="btn primary" id="next">${pos === order.length - 1 ? 'Ver resultados' : 'Siguiente →'}</button>
      </div>
    </article>`;
  app.querySelectorAll('.opt').forEach(b => b.addEventListener('click', () => choose(+b.dataset.i)));
  $('#prev').onclick = prev;
  $('#next').onclick = next;
}

function choose(i) {
  const id = order[pos];
  if (answers[id] || showingSummary) return;
  answers[id] = { chosen: i, correct: opts[id][i].correct };
  render();
}
function next() {
  if (showingSummary) return;
  if (pos < order.length - 1) { pos++; render(); window.scrollTo({ top: 0 }); }
  else { showingSummary = true; render(); }
}
function prev() {
  if (showingSummary) { showingSummary = false; render(); return; }
  if (pos > 0) { pos--; render(); }
}

function renderSummary() {
  const done = Object.keys(answers).length;
  const ok = Object.values(answers).filter(a => a.correct).length;
  const missed = order.filter(id => answers[id] && !answers[id].correct);
  const skipped = order.length - done;
  app.innerHTML = `
    <section class="card summary">
      <h2>Resultados</h2>
      <div class="big">${ok} / ${order.length}</div>
      <p>${done} respondidas · ${missed.length} falladas${skipped ? ` · ${skipped} sin responder` : ''}</p>
      <div class="nav">
        <button class="btn" id="back">← Volver</button>
        <span style="display:flex;gap:8px;flex-wrap:wrap">
          ${missed.length ? '<button class="btn primary" id="retry">Repasar falladas</button>' : ''}
          <button class="btn" id="again">Empezar de nuevo</button>
        </span>
      </div>
      ${missed.length ? `<ul class="missed">${missed.map(id => {
        const q = QUESTIONS[id];
        return `<li>${fmt(q.q)}<div class="ans">✓ ${fmt(q.options[0].text)}</div></li>`;
      }).join('')}</ul>` : ''}
    </section>`;
  $('#back').onclick = prev;
  $('#again').onclick = () => start(filteredIds());
  if (missed.length) $('#retry').onclick = () => start(missed);
}

document.addEventListener('keydown', e => {
  if (e.target.tagName === 'SELECT') return;
  if (['1', '2', '3', '4'].includes(e.key) && !showingSummary) choose(+e.key - 1);
  else if (e.key === 'Enter' || e.key === 'ArrowRight') { if (e.target.tagName !== 'BUTTON' || e.key === 'ArrowRight') next(); }
  else if (e.key === 'ArrowLeft') prev();
});

const cats = [...new Set(QUESTIONS.map(q => q.cat))];
cats.forEach(c => {
  const n = QUESTIONS.filter(q => q.cat === c).length;
  $('#cat').insertAdjacentHTML('beforeend', `<option value="${esc(c)}">${esc(c)} (${n})</option>`);
});
$('#cat').options[0].textContent = `Todas las categorías (${QUESTIONS.length})`;
$('#cat').addEventListener('change', () => start(filteredIds()));
$('#shuffle').addEventListener('click', () => start(filteredIds()));

start(filteredIds());
</script>
